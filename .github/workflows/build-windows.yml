name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build UntitledBrowser.exe
        run: pyinstaller --noconfirm --onefile --windowed --name UntitledBrowser launcher.py

      - name: Smoke test the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:UNTITLED_BROWSER_SMOKE = "1"
          $p = Start-Process -FilePath ".\dist\UntitledBrowser.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: UntitledBrowser-windows
          path: dist/UntitledBrowser.exe

      - name: Attach exe to release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Untitled Browser v1.0.0
          files: dist/UntitledBrowser.exe
